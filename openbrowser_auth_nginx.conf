server {
 listen 8767;
 server_name _;
 auth_basic "G1 Private Browser Session";
 auth_basic_user_file /run/openbrowser-ui.htpasswd;
 add_header Cache-Control "no-store" always;
 location = /g1-handoff-preview {
  proxy_pass http://127.0.0.1:8769/handoff-preview;
  proxy_read_timeout 30;
 }
 location = /g1-batch-operator {
  proxy_pass http://127.0.0.1:8769/batch-operator;
 }
 location = /g1-batch-create {
  proxy_pass http://127.0.0.1:8769/batch-create;
  limit_except POST { deny all; }
 }
 location = /g1-batch-capture {
  proxy_pass http://127.0.0.1:8769/batch-capture;
  limit_except POST { deny all; }
 }
 location = /g1-batch-status {
  proxy_pass http://127.0.0.1:8769/batch-status;
 }
 location = /g1-cache {
  proxy_pass http://127.0.0.1:8769/cache;
  proxy_read_timeout 30;
 }
 location = /g1-inspect {
  proxy_pass http://127.0.0.1:8769/inspect;
  proxy_read_timeout 30;
 }
 location /vnc/ {
  proxy_pass http://127.0.0.1:6081/;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_read_timeout 3600;
 }
 location /websockify {
  proxy_pass http://127.0.0.1:6081/websockify;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_read_timeout 3600;
 }
 location / {
  proxy_pass http://127.0.0.1:8768;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 3600;
 }
}
